<!DOCTYPE html>
<html lang="fr" class="scroll-smooth ">
<head>
  <meta charset="UTF-8">
  <title>SKETCH_STORYBOARD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    fetch("../Components/header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header-placeholder").innerHTML = data;
      });

    fetch("../Components/footer.html")
      .then(res => res.text())
      .then(data => {

</head>
<body class="bg-white text-black font-[CourrierNew]">

  <div class="sticky top-1 self-start" id="header-placeholder"></div>
  
  <div class="grid grid-cols-12 gap-x-5 gap-y-[188px]">
    <div class="text-center">

</html>
